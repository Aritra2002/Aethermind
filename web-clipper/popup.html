<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090a16;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    h3 {
      margin: 0;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      background: rgba(129, 140, 248, 0.2);
      color: #818cf8;
      border-radius: 999px;
      border: 1px solid rgba(129, 140, 248, 0.3);
    }
    p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #6366f1;
      border-color: #6366f1;
      color: white;
    }
    button.primary {
      background: #6366f1;
      border-color: #4f46e5;
    }
    button.primary:hover {
      background: #4f46e5;
    }
    .settings {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settings label {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .url-row {
      display: flex;
      gap: 6px;
    }
    .url-row input {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.78rem;
      outline: none;
    }
    .url-row input:focus {
      border-color: #6366f1;
    }
    .url-row button {
      width: auto;
      padding: 7px 12px;
      white-space: nowrap;
      font-size: 0.75rem;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status {
      margin-top: 14px;
      padding: 8px 10px;
      font-size: 0.78rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      display: none;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>AetherMind</h3>
    <span class="badge">Web Clipper</span>
  </div>
  <p>Capture research, articles, and bookmarks directly into your local knowledge graph.</p>

  <div class="btn-group">
    <button id="clipArticleBtn" class="primary">
      <span>📄 Clip Full Article</span>
      <span>➔</span>
    </button>
    <button id="clipSelectionBtn">
      <span>✂️ Clip Selected Text</span>
      <span>➔</span>
    </button>
    <button id="clipBookmarkBtn">
      <span>🔖 Save Bookmark Link</span>
      <span>➔</span>
    </button>
  </div>

  <div class="settings">
    <div class="url-row">
      <input id="appUrlInput" type="text" placeholder="https://you.github.io/Aethermind/">
      <button id="saveSettingsBtn">Save</button>
    </div>
    <label for="appUrlInput" style="font-size:0.7rem;color:#64748b;">AetherMind app URL (default: local dev server). The extension reuses an open AetherMind tab when possible, otherwise opens the app with your clip.</label>
    <div class="toggle-row">
      <label for="asDocumentToggle">Save clips as searchable documents (RAG)</label>
      <input id="asDocumentToggle" type="checkbox">
    </div>
  </div>

  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
