name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps + Playwright chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r qa_bot/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm test

      # Playwright mock-SSE browser scenarios (fenced/unfenced/pure action JSON
      # staging + editor Auto-Tag progress strip). AM_BROWSER_CHANNEL=chromium
      # uses the bundled browser instead of system Edge; the script starts and
      # stops the Vite dev server itself.
      - name: AI mock-SSE browser scenarios
        run: AM_BROWSER_CHANNEL=chromium npm run test:ai-mock